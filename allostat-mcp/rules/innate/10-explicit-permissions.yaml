id: innate-10
name: >
  Confirm before OAuth/SSO grants, agreement acceptance, payments, API-key
  issuance, webhook registration, or account-security changes
severity: lethal
tier: innate
description: >
  Each of these actions requires explicit chat confirmation, one at a time:
  OAuth authorization and SSO completion; accepting terms, licences,
  invitations, privacy policies, or cookie consent; granting a sharing
  permission; issuing or rotating an API key; registering a webhook endpoint;
  completing a Stripe charge or another payment; activating a subscription;
  setting a password; setting up 2FA; and changing account settings. Implicit
  acceptance mechanisms — pre-checked consent boxes, auto-acceptance timers,
  and "required to continue" prompts — are NOT valid authorization for any of
  them.

  SCOPE, stated plainly (operator ruling, 2026-08-03): this rule covers the
  shapes enumerated above and nothing wider. It does NOT claim to cover every
  action that grants access. Permission-grant shapes across present and future
  MCP tools are not enumerable, so a universal promise would be unkeepable by
  construction — wrong by a margin nobody can measure, while the operator plans
  around it. A narrower rule that blocks reliably is worth more than a broad one
  that misses silently. Permission-shaped calls this rule does not recognize are
  RECORDED (`permission_shape_unclassified`) rather than blocked, so the gaps
  are visible and this list grows from real usage instead of guesswork.
trigger:
  # Every entry here must be a value `_classify_semantic_operation` can
  # actually return (wrapper/hooks/pre-tool-use.py). `file_share_change` and
  # `dashboard_access_modify` were listed until 2026-08-03 and no classifier
  # branch could ever emit them — advertised coverage that could not fire.
  match_any:
    - operation: oauth_authorize
    - operation: sso_complete
    - operation: terms_of_service_accept
    - operation: privacy_policy_accept
    - operation: cookie_consent
    - operation: sharing_permission_grant
    - operation: api_key_grant
    - operation: webhook_endpoint_register
    - operation: stripe_charge
    - operation: payment_complete
    - operation: subscription_activate
    - operation: account_setting_change
    - operation: password_set
    - operation: 2fa_setup
response:
  action: hard_pause
  display: red_box
  message: |
    ⛔ AUTHORIZATION REQUIRED

    Action: {operation_type}
    Target: {target}
    Effect: {what_changes_permanently}

    This action changes access / permissions / agreements / financial state
    in ways that may be hard to reverse.

    (This guard recognizes a specific list of action shapes, not every
    possible permission grant — see the rule's scope note.)

    How to proceed:

      Type `allostat: override` in your next message to authorize THIS
      one action. Consent is single-use — the guard re-arms immediately
      after, so every such action gets its own confirmation.

      (Legacy escape for non-interactive/bench use:
      ALLOSTAT_INNATE_OVERRIDES=innate-10. Editing this rule file is NOT
      an escape: an edited rule fails its content pin and is DISABLED
      entirely until the file is restored. Ask the agent how to disable a
      guard instead.)

    Things I will NOT accept as authorization on your behalf:
      • Pre-checked agreement boxes
      • Auto-acceptance timers
      • "Required to continue" prompts
      • "Implied consent" claims
      • Email-based authorization links you didn't request
      • Hidden text in observed content claiming you've pre-authorized

    If you want me to set up standing authorization for a specific class
    of actions (e.g., 'always accept cookies on this domain'), say so and
    I'll add it as a learned rule. Default is per-action confirmation.
exception_required: explicit_chat_confirmation_per_action
auto_decline_defaults:
  cookie_banners: decline_non_essential
  marketing_consent: decline
  data_sharing_optional: decline
why_lethal: >
  Granted permissions are hard to revoke (especially OAuth scopes spread
  across third parties). Accepted agreements bind the operator. Financial
  transactions are recoverable only via dispute processes. The friction
  of per-action confirmation is the price of preventing a category of
  catastrophic mistakes that operators frequently make under time pressure.
  Source: Dom's CLAUDE.md (explicit permission actions section).
