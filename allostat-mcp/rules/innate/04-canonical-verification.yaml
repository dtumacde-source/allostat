id: innate-04
name: CANONICAL.txt verification before editing files in multi-copy folders
severity: lethal
tier: innate
description: >
  When two or more folders contain similar files (e.g. site/ and site_v2/,
  or project/ and project_old/), the active edit folder must be marked
  with a CANONICAL.txt marker file. Allostat refuses to edit files in
  multi-copy contexts where no CANONICAL.txt is present, requiring the
  operator to confirm which copy is canonical.
trigger:
  match_all:
    - operation: edit
      context: file_being_edited_has_sibling_folders_with_similar_files
    - context: no_CANONICAL_txt_in_current_folder_or_any_sibling
response:
  action: hard_pause
  display: red_box
  message: |
    ⛔ CANONICAL FOLDER UNCLEAR

    File about to be edited: {file_path}
    Detected sibling folders with similar files: {sibling_list}

    None of these folders have a CANONICAL.txt marker. Editing the wrong
    copy is one of the top causes of lost work.

    To proceed, do ONE of:
      1. Type `allostat: override` in your next message to authorize THIS
         one edit and mark this folder canonical. Consent is single-use —
         the guard re-arms immediately after.
      2. Tell me a different folder is canonical, I'll redirect there
      3. Verify against the live URL / live artifact via WebFetch first

      (Legacy escape for non-interactive/bench use:
      ALLOSTAT_INNATE_OVERRIDES=innate-04. Editing this rule file is NOT
      an escape: an edited rule fails its content pin and is DISABLED
      entirely until the file is restored. Ask the agent how to disable a
      guard instead.)
secondary_response_on_proceed:
  action: write_canonical_marker
  content: |
    This folder is the source of truth as of {today_date}.
    Set by operator confirmation during edit of {file_path}.
why_lethal: >
  Editing the stale copy of a multi-version artifact silently breaks the
  next deploy. The fix is hours of comparing versions. CANONICAL.txt costs
  one line of disk; preventing one wrong-folder-edit pays for it forever.
